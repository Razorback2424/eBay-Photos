        - paragraph [ref=e233]: No. Processing runs entirely in your browser. Your card photos never leave your device.
      - article [ref=e234]:
        - heading "Which browsers work best?" [level=3] [ref=e235]
        - paragraph [ref=e236]: "Chrome, Edge, and Brave are the preferred path. Safari still works, but the current limitation is export behavior: Safari uses a ZIP download instead of direct folder write."
