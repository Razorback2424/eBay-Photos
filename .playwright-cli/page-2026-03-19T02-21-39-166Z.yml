        - heading "Who is this best for?" [level=3] [ref=e238]
        - paragraph [ref=e239]: It is especially useful for higher-value singles where front, back, and corner details matter. It also helps any seller whose bottleneck is sorting and organizing a batch after the photos are taken.
      - article [ref=e240]:
        - heading "What happens after I sign up?" [level=3] [ref=e241]
        - paragraph [ref=e242]: You buy access on Gumroad, receive the license key immediately, enter it on the access page, and go straight into the workspace. The first in-app note then tells you how to photograph fronts, backs, and confirm pairings before export.
      - article [ref=e243]:
        - heading "Do I need to install anything?" [level=3] [ref=e244]
        - paragraph [ref=e245]: No install is required for the normal flow. The app is presented as a browser-based workspace where you upload scans, process them, and export listing assets.
